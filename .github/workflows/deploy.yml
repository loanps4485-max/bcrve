name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare public assets
        run: |
          mkdir -p public
          cp index.html admin.html app.js admin.js styles.css admin.css public/

      - name: Upload Worker secret
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN" > .secrets
          npx wrangler@latest secret bulk .secrets --name bcrve
          rm -f .secrets

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
