name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public assets
        run: |
          mkdir -p public
          cp index.html admin.html app.js admin.js styles.css admin.css public/

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker.js --name bcrve --var "BOT_TOKEN:${BOT_TOKEN}"

      - name: Deployment triggered
        run: echo "BCRVE deployment check: $GITHUB_SHA"

# trigger
