name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare public assets
        run: |
          node --check app.js
          node --check admin.js
          mkdir -p public
          cp index.html admin.html app.js admin.js styles.css admin.css public/

      - name: Validate Telegram bot token
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          test -n "$BOT_TOKEN"
          curl --fail --silent --show-error "https://api.telegram.org/bot${BOT_TOKEN}/getMe" |
            python3 -c 'import json,sys; d=json.load(sys.stdin)["result"]; print("Telegram bot token valid for @" + d.get("username","unknown") + " (id " + str(d["id"]) + ").")'

      - name: Remove legacy plaintext binding
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.144.0"
          command: deploy

      - name: Deploy Worker with Telegram secret
        uses: cloudflare/wrangler-action@v4
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.144.0"
          secrets: |
            BOT_TOKEN
          command: deploy

      - name: Verify Telegram authorization without creating an order
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { createHmac, webcrypto } from "node:crypto";
          import { readFile } from "node:fs/promises";

          globalThis.crypto ??= webcrypto;
          const token = process.env.BOT_TOKEN?.trim();
          assert(token, "BOT_TOKEN is unavailable to the verification step.");

          const source = await readFile("./worker.js", "utf8");
          const moduleUrl = "data:text/javascript;base64," + Buffer.from(source).toString("base64");
          const { default: worker } = await import(moduleUrl);

          function signedInitData(userId) {
            const fields = {
              auth_date: String(Math.floor(Date.now() / 1000)),
              user: JSON.stringify({ id: userId, first_name: "Deployment check" }),
            };
            const checkString = Object.keys(fields)
              .sort()
              .map(key => key + "=" + fields[key])
              .join(String.fromCharCode(10));
            const secret = createHmac("sha256", "WebAppData").update(token).digest();
            const hash = createHmac("sha256", secret).update(checkString).digest("hex");
            return new URLSearchParams({ ...fields, hash }).toString();
          }

          async function expectStatus(path, expected, { userId, body } = {}) {
            const headers = {};
            if (userId !== undefined) headers["X-Telegram-Init-Data"] = signedInitData(userId);
            if (body !== undefined) headers["Content-Type"] = "application/json";
            const request = new Request("https://bcrve.test" + path, {
              method: body === undefined ? "GET" : "POST",
              headers,
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const response = await worker.fetch(request, { BOT_TOKEN: token, DB: {} });
            const message = await response.text();
            assert.equal(response.status, expected, path + " returned " + response.status + ": " + message);
          }

          await expectStatus("/api/admin/check", 200, { userId: 6898182858 });
          await expectStatus("/api/admin/check", 200, { userId: 5379947962 });
          await expectStatus("/api/admin/check", 403, { userId: 1111111111 });
          await expectStatus("/api/admin/orders", 401);
          await expectStatus("/api/orders", 400, { userId: 6898182858, body: { items: [] } });

          console.log("Telegram auth passed for both admins; other and unauthenticated accounts were denied; no order was created.");
          JS
# redeploy